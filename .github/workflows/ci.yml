name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: loomool
          POSTGRES_PASSWORD: loomool
          POSTGRES_DB: loomool
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U loomool -d loomool"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/test.txt
      - name: Install test deps
        run: pip install -r requirements/test.txt
      - name: Store isolation (blocking)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DATABASE_URL: postgresql://loomool:loomool@localhost:5432/loomool
          DJANGO_SECRET_KEY: ci-test-secret-key-ci-test-secret-key-ci-test-secret-key-ci
        run: |
          pytest \
            apps/stores/tests/test_isolation_api.py \
            apps/catalog/tests/test_product_crud.py::TestProductListIsolation \
            apps/catalog/tests/test_product_crud.py::TestProductDetailIsolation \
            apps/catalog/tests/test_images.py::TestImageUpload::test_other_seller_cannot_upload \
            apps/catalog/tests/test_bom.py::TestBOMIsolation \
            apps/catalog/tests/test_relationships.py::TestRelationships::test_other_seller_cannot_add \
            -x --no-header -q

  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/lint.txt
      - name: Install lint deps
        run: pip install -r requirements/lint.txt
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: bandit
        run: bandit -r apps config -c pyproject.toml --exclude "apps/*/tests/*"
      - name: pip-audit (production)
        run: pip-audit -r requirements/production.txt

  frontend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [storefront, seller-portal]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10}
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.0"
          cache: pnpm
          cache-dependency-path: ${{ matrix.app }}/pnpm-lock.yaml
      - name: Install
        working-directory: ${{ matrix.app }}
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: ${{ matrix.app }}
        run: pnpm typecheck
      - name: Lint
        working-directory: ${{ matrix.app }}
        run: pnpm lint
      - name: Build
        working-directory: ${{ matrix.app }}
        run: pnpm build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}